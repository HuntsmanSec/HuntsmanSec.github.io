<div class="terminal-bar" aria-hidden="true">
  <span></span><span></span><span></span>
</div>
<div class="interactive-terminal" data-terminal>
  <div class="terminal-output" data-terminal-output aria-live="polite">
    <p><span>$</span> boot --portfolio</p>
    <p>HuntsmanSec public archive loaded.</p>
    <p>Type <strong>help</strong> to list commands.</p>
  </div>
  <form class="terminal-input-row" data-terminal-form>
    <label for="terminal-command">$</label>
    <input id="terminal-command" name="command" type="text" autocomplete="off" spellcheck="false" placeholder="try: whoami, ls, cd career, cert">
  </form>
</div>
