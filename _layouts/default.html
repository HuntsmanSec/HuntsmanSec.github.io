<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">H/S</span>
        <span>
          <strong>{{ site.title }}</strong>
          <small>Cybersecurity Portfolio</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <!-- Core Professional Links -->
        <a href="{{ '/career/' | relative_url }}">Career</a>
        <a href="{{ '/trainings/' | relative_url }}">Trainings</a>
        <a href="{{ '/certifications/' | relative_url }}">Certs</a>
        <a href="{{ '/speakership-mentorship/' | relative_url }}">Talks</a>
        <a href="{{ '/ctf-writeups/' | relative_url }}">CTFs</a>

        <!-- Resources Dropdown Menu -->
        <div class="nav-dropdown">
          <button class="dropdown-trigger" aria-haspopup="true" aria-expanded="false">
            Resources <span class="arrow">▼</span>
         /*  </button>
              <div class="dropdown-content">
                <a href="{{ '/soc-notes/' | relative_url }}">SOC-Notes</a>
                <a href="{{ '/cheatsheets/' | relative_url }}">Cheatsheets</a>
                <a href="{{ '/recognitions/' | relative_url }}">Recognitions</a>
                <a href="{{ '/conferences/' | relative_url }}">Conferences</a>
                <a href="{{ '/misc/' | relative_url }}">Misc</a>
              </div> */
        </div>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>Built by Huntsman</span>
      <span>Are you a 1 or a 0?</span>
    </footer>

    <script src="{{ '/assets/js/filters.js' | relative_url }}"></script>
  </body>
</html>
